<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>读者登录 - 图书借阅</title>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <link rel="stylesheet" href="https://unpkg.com/bootstrap@3.3.7/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/font-awesome@4.7.0/dist/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://unpkg.com/admin-lte@2.3.8/dist/css/AdminLTE.min.css">
  <link rel="stylesheet" href="https://unpkg.com/admin-lte@2.3.8/dist/css/skins/_all-skins.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="hold-transition login-page">
<div class="login-box" id="app" v-cloak>
  <div class="login-logo">
    <b>图书借阅</b> · 读者端
  </div>
  <div class="login-box-body">
    <p class="login-box-msg">读者登录</p>
    <div v-if="error" class="alert alert-danger alert-dismissible">
      <h4 style="margin-bottom: 0px;"><i class="fa fa-exclamation-triangle"></i> {{errorMsg}}</h4>
    </div>
    <div class="form-group has-feedback">
      <input type="text" class="form-control" v-model="loginName" placeholder="登录账号" @keyup.enter="login">
      <span class="glyphicon glyphicon-user form-control-feedback"></span>
    </div>
    <div class="form-group has-feedback">
      <input type="password" class="form-control" v-model="password" placeholder="密码" @keyup.enter="login">
      <span class="glyphicon glyphicon-lock form-control-feedback"></span>
    </div>
    <div class="form-group has-feedback">
      <div class="row">
        <div class="col-xs-12">
          <button type="button" class="btn btn-primary btn-block btn-flat" @click="login">登录</button>
        </div>
      </div>
    </div>
    <div class="callout callout-info" style="padding: 10px; margin-bottom: 0;">
      <p style="margin: 0 0 4px;"><b>读者测试账号</b>：test / 123456</p>
      <p style="margin: 0;">后台账号（管理员 / 审核人员）请走 <a href="/admin/login.html">后台入口</a></p>
    </div>
  </div>
</div>
<script src="https://unpkg.com/jquery@2.2.4/dist/jquery.min.js"></script>
<script src="https://unpkg.com/vue@2.2.6/dist/vue.min.js"></script>
<script src="https://unpkg.com/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>
<script type="text/javascript">
  var vm = new Vue({
    el: "#app",
    data: {
      loginName: "test",
      password: "",
      error: false,
      errorMsg: "",
    },
    methods: {
      login: function () {
        if (!vm.loginName || !vm.password) {
          vm.error = true;
          vm.errorMsg = "请输入账号和密码";
          return;
        }
        $.ajax({
          type: "POST",
          url: "/api/login",
          data: "loginName=" + encodeURIComponent(vm.loginName) + "&password=" + encodeURIComponent(vm.password),
          dataType: "json",
          success: function (r) {
            if (r.code == 0) {
              localStorage.setItem("readerToken", r.token);
              localStorage.setItem("readerName", (r.member && r.member.nickname) ? r.member.nickname : vm.loginName);
              localStorage.setItem("readerId", r.member ? r.member.id : "");
              location.href = "index.html";
            } else {
              vm.error = true;
              vm.errorMsg = r.msg || "登录失败";
            }
          },
          error: function () {
            vm.error = true;
            vm.errorMsg = "网络异常，请稍后重试";
          },
        });
      },
    },
  });
</script>
</body>
</html>
